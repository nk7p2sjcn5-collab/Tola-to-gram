<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Calculator Suite</title>
  <style>
    :root {
      /* Tola section colors */
      --tola-bg: #fffdf5;
      --tola-border: #f3e5be;
      --tola-header-bg: #d9932b;
      --tola-btn-bg: #c9851f;
      --tola-btn-hover: #b37418;
      --tola-accent-bg: #fdf5e6;
      --tola-text: #4a3810;

      /* Gram section colors */
      --gram-bg: #f7faf8;
      --gram-border: #d4e7dd;
      --gram-header-bg: #2d734e;
      --gram-btn-bg: #2c6e49;
      --gram-btn-hover: #22573a;
      --gram-accent-bg: #edf5f0;
      --gram-text: #1b3d2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f5f2eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      max-width: 900px;
      width: 100%;
    }

    /* Top Tab Navigation Buttons */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 1.5px solid #dcd3be;
      background-color: #ffffff;
      color: #666;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .tab-btn.active {
      background-color: var(--tola-header-bg);
      color: #ffffff;
      border-color: var(--tola-header-bg);
      box-shadow: 0 4px 12px rgba(217, 147, 43, 0.25);
    }

    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    /* Converter 1 Layout */
    .converter-wrapper {
      position: relative;
      display: flex;
      flex-direction: row;
      gap: 24px;
      align-items: center;
      width: 100%;
    }

    .swap-divider {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: #ffffff;
      border: 1px solid #e2cb98;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      z-index: 10;
      color: #b37a24;
      font-size: 20px;
    }

    /* Converter Card Base */
    .card {
      flex: 1;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .card-tola {
      background-color: var(--tola-bg);
      border: 1.5px solid var(--tola-border);
    }

    .card-gram {
      background-color: var(--gram-bg);
      border: 1.5px solid var(--gram-border);
    }

    /* Header Section */
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .card-tola .icon-badge { background-color: var(--tola-header-bg); }
    .card-gram .icon-badge { background-color: var(--gram-header-bg); }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .card-tola .card-title { color: var(--tola-text); }
    .card-gram .card-title { color: var(--gram-text); }

    /* Form Elements */
    .field-group {
      margin-bottom: 20px;
    }

    .label {
      display: block;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    .input-box {
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .card-tola .input-box { border: 1px solid #e0d8c3; }
    .card-gram .input-box { border: 1px solid #cadbcf; }

    .input-box input, .input-box select {
      flex: 1;
      border: none;
      padding: 12px 14px;
      font-size: 1.1rem;
      outline: none;
      color: #333;
    }

    .unit-select {
      background: #ffffff;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .card-tola .unit-select {
      border-left: 1px solid #e0d8c3;
      color: var(--tola-text);
    }

    .card-gram .unit-select {
      border-left: 1px solid #cadbcf;
      color: var(--gram-text);
    }

    /* Result Box */
    .result-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .card-tola .result-box {
      background-color: var(--tola-accent-bg);
      border: 1px solid #faebcc;
      color: #222;
    }

    .card-gram .result-box {
      background-color: var(--gram-accent-bg);
      border: 1px solid #d0e6d8;
      color: #222;
    }

    .result-unit {
      font-size: 1rem;
      font-weight: normal;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s ease;
    }

    .card-tola .btn { background-color: var(--tola-btn-bg); }
    .card-tola .btn:hover { background-color: var(--tola-btn-hover); }

    .card-gram .btn { background-color: var(--gram-btn-bg); }
    .card-gram .btn:hover { background-color: var(--gram-btn-hover); }

    /* Karat Table Styles */
    .karat-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--tola-border);
    }

    .karat-table th, .karat-table td {
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #f0e6cf;
      font-size: 1.05rem;
    }

    .karat-table th {
      background-color: #fdf3d8;
      color: var(--tola-text);
      font-weight: 700;
    }

    .karat-table tr:last-child td {
      border-bottom: none;
    }

    .karat-table td:first-child {
      font-weight: bold;
      color: var(--tola-header-bg);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .converter-wrapper {
        flex-direction: column;
      }
      .swap-divider {
        position: relative;
        left: 0;
        top: 0;
        transform: none;
        margin: -8px auto;
      }
      .nav-tabs {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Option Selector Buttons -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tolaGramTab', this)">
        ⚖️ तोला - ग्राम कन्भर्टर
      </button>
      <button class="tab-btn" onclick="switchTab('purityTab', this)">
        ✨ प्युरिटी क्याल्कुलेटर
      </button>
      <button class="tab-btn" onclick="switchTab('karatChartTab', this)">
        📋 क्यारेट चार्ट (Karat Chart)
      </button>
    </div>

    <!-- OPTION 1: Tola Gram Calculator -->
    <div id="tolaGramTab" class="tab-content active">
      <div class="converter-wrapper">
        
        <div class="card card-tola">
          <div class="card-header">
            <div class="icon-badge">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h18"/></svg>
            </div>
            <h2 class="card-title">तोला बाट ग्राम</h2>
          </div>

          <div class="field-group">
            <label class="label">तोलामा मूल्य प्रविष्ट गर्नुहोस्</label>
            <div class="input-box">
              <input type="number" id="tolaInput" placeholder="उदाहरण: 1" step="any" min="0">
              <div class="unit-select">тоला <span>&#9662;</span></div>
            </div>
          </div>

          <div class="field-group">
            <label class="label">ग्राममा परिणाम</label>
            <div class="result-box">
              <span id="gramResult">0.000</span>
              <span class="result-unit">ग्राम</span>
            </div>
          </div>

          <button class="btn" onclick="convertTolaToGram()">कन्भर्ट गर्नुहोस्</button>
        </div>

        <div class="swap-divider">&#8646;</div>

        <div class="card card-gram">
          <div class="card-header">
            <div class="icon-badge">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.9 2.6l2 9A2 2 0 0 0 8.5 21h7a2 2 0 0 0 1.9-1.4l2-9A2 2 0 0 0 17.5 8z"/></svg>
            </div>
            <h2 class="card-title">ग्राम बाट तोला</h2>
          </div>

          <div class="field-group">
            <label class="label">ग्राममा मूल्य प्रविष्ट गर्नुहोस्</label>
            <div class="input-box">
              <input type="number" id="gramInput" placeholder="उदाहरण: 10" step="any" min="0">
              <div class="unit-select">ग्राम <span>&#9662;</span></div>
            </div>
          </div>

          <div class="field-group">
            <label class="label">तोलामा परिणाम</label>
            <div class="result-box">
              <span id="tolaResult">0.000</span>
              <span class="result-unit">तोलामा</span>
            </div>
          </div>

          <button class="btn" onclick="convertGramToTola()">कन्भर्ट गर्नुहोस्</button>
        </div>

      </div>
    </div>

    <!-- OPTION 2: Purity Calculator Box -->
    <div id="purityTab" class="tab-content">
      <div class="card card-tola" style="max-width: 550px; margin: 0 auto;">
        <div class="card-header">
          <div class="icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </div>
          <h2 class="card-title">शुद्धता (Purity) क्याल्कुलेटर</h2>
        </div>

        <div class="field-group">
          <label class="label">कुल तौल (Total Weight)</label>
          <div class="input-box">
            <input type="number" id="purityWeightInput" placeholder="उदाहरण: 10" step="any" min="0">
          </div>
        </div>

        <div class="field-group">
          <label class="label">क्यारेट छान्नुहोस् (Select Karat)</label>
          <div class="input-box">
            <select id="purityKaratSelect" onchange="calculatePurity()">
              <option value="24">24K (99.9%)</option>
              <option value="23">23K (95.8%)</option>
              <option value="22" selected>22K (91.6%)</option>
              <option value="18">18K (75.0%)</option>
              <option value="14">14K (58.3%)</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label class="label">शुद्ध सुनको तौल (Pure 24K Gold)</label>
          <div class="result-box">
            <span id="pureGoldResult">0.000</span>
            <span class="result-unit">तौल</span>
          </div>
        </div>

        <button class="btn" onclick="calculatePurity()">हिसाब गर्नुहोस्</button>
      </div>
    </div>

    <!-- OPTION 3: Karat / Alloy Mix Table (Note Match) -->
    <div id="karatChartTab" class="tab-content">
      <div class="card card-tola" style="max-width: 600px; margin: 0 auto;">
        <div class="card-header">
          <div class="icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <h2 class="card-title">Karat & Alloy Ratio Chart</h2>
        </div>

        <div class="field-group">
          <label class="label">आधार तौल प्रविष्ट गर्नुहोस् (Base Pure Gold Weight)</label>
          <div class="input-box">
            <input type="number" id="chartBaseWeight" value="1" step="any" min="0" oninput="updateChartTable()">
          </div>
        </div>

        <table class="karat-table">
          <thead>
            <tr>
              <th>Karat</th>
              <th>Pure Gold</th>
              <th>Alloy Mix (तामा)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>24K</td>
              <td id="pg-24k">-</td>
              <td>0</td>
            </tr>
            <tr>
              <td>23K</td>
              <td id="pg-23k">1</td>
              <td id="mix-23k">0.03</td>
            </tr>
            <tr>
              <td>22K</td>
              <td id="pg-22k">1</td>
              <td id="mix-22k">0.07</td>
            </tr>
            <tr>
              <td>18K</td>
              <td id="pg-18k">1</td>
              <td id="mix-18k">0.333</td>
            </tr>
            <tr>
              <td>14K</td>
              <td id="pg-14k">1</td>
              <td id="mix-14k">0.4167</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const CONVERSION_RATE = 11.664;

    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    // Tola-Gram Logic
    const tolaInput = document.getElementById('tolaInput');
    const gramResult = document.getElementById('gramResult');
    const gramInput = document.getElementById('gramInput');
    const tolaResult = document.getElementById('tolaResult');

    function convertTolaToGram() {
      const value = parseFloat(tolaInput.value);
      gramResult.textContent = (isNaN(value) || value <= 0) ? '0.000' : (value * CONVERSION_RATE).toFixed(3);
    }

    function convertGramToTola() {
      const value = parseFloat(gramInput.value);
      tolaResult.textContent = (isNaN(value) || value <= 0) ? '0.000' : (value / CONVERSION_RATE).toFixed(3);
    }

    tolaInput.addEventListener('input', convertTolaToGram);
    gramInput.addEventListener('input', convertGramToTola);

    // Purity Logic
    const purityWeightInput = document.getElementById('purityWeightInput');
    const purityKaratSelect = document.getElementById('purityKaratSelect');
    const pureGoldResult = document.getElementById('pureGoldResult');

    function calculatePurity() {
      const weight = parseFloat(purityWeightInput.value);
      const karat = parseFloat(purityKaratSelect.value);

      pureGoldResult.textContent = (isNaN(weight) || weight <= 0) ? '0.000' : (weight * (karat / 24)).toFixed(3);
    }

    purityWeightInput.addEventListener('input', calculatePurity);

    // Karat Chart Dynamic Table Generator
    function updateChartTable() {
      const base = parseFloat(document.getElementById('chartBaseWeight').value) || 0;
      
      document.getElementById('pg-24k').textContent = base ? base.toFixed(3) : '-';
      document.getElementById('pg-23k').textContent = base ? base.toFixed(3) : '-';
      document.getElementById('pg-22k').textContent = base ? base.toFixed(3) : '-';
      document.getElementById('pg-18k').textContent = base ? base.toFixed(3) : '-';
      document.getElementById('pg-14k').textContent = base ? base.toFixed(3) : '-';

      document.getElementById('mix-23k').textContent = (base * 0.03).toFixed(3);
      document.getElementById('mix-22k').textContent = (base * 0.07).toFixed(3);
      document.getElementById('mix-18k').textContent = (base * 0.333).toFixed(3);
      document.getElementById('mix-14k').textContent = (base * 0.4167).toFixed(4);
    }

    // Initialize Table Values
    updateChartTable();
  </script>
</body>
</html>
